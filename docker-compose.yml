services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ptithotel-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "1433:1433"
    volumes:
      - ptithotel_sql_data:/var/opt/mssql

volumes:
  ptithotel_sql_data:
